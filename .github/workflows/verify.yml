# What this repo cannot verify by reading, it verifies here.
#
# The renderer is platform-independent and its checks gate every push. The sleep
# lock is not: it is three different mechanisms behind one interface, and two of
# them had never been executed by anyone when they were written. This workflow
# exists mainly to change that.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    # Type checking, the unit tests and the scene soak. Same code path
    # everywhere, so a failure on any platform is a real failure.
    name: render (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node tools/soak.ts

  awake:
    # The load-bearing one. tools/check-awake.ts holds the real lock against a
    # throwaway process, asks the OS whether it is held, then SIGKILLs the target
    # and confirms the watcher lets go.
    #
    # All three gate the build. They did not start that way: Windows and Linux
    # had never been executed by anyone, so they reported instead of failing until
    # a green run proved they worked. Both have now gone green — and Linux only
    # after this found that it was asking logind for an inhibitor that a machine
    # with no login session refuses outright, holding nothing at all.
    name: awake (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No npm ci: this tool imports src/awake.ts and nothing else, and running
      # it without the devDependencies proves the program itself needs none.
      - run: node tools/check-awake.ts

  probe-linux:
    # Diagnosis, not a check: run by hand when the question "why can this runner
    # not take an inhibitor?" comes up. `awake (ubuntu-latest)` fails with
    # "Failed to inhibit: Access denied", and which of logind's polkit actions is
    # being refused decides whether that is a bug here or an environment with
    # nothing to inhibit in the first place.
    if: github.event_name == 'workflow_dispatch'
    name: probe (linux inhibitor permissions)
    runs-on: ubuntu-latest
    steps:
      - name: who are we, and what will logind allow
        run: |
          set +e
          echo "--- identity and session ---"
          id
          echo "XDG_SESSION_ID=${XDG_SESSION_ID:-<unset>}"
          loginctl list-sessions 2>&1 | head -5
          loginctl session-status 2>&1 | head -5
          echo
          echo "--- every what/mode combination ---"
          for what in idle:sleep idle sleep shutdown; do
            for mode in block delay; do
              out=$(systemd-inhibit --what=$what --mode=$mode --who=probe --why=probe true 2>&1)
              echo "what=$what mode=$mode rc=$? :: ${out:-<silent>}"
            done
          done
          echo
          echo "--- as root, for contrast ---"
          out=$(sudo systemd-inhibit --what=idle:sleep --mode=block --who=probe --why=probe true 2>&1)
          echo "root idle:sleep block rc=$? :: ${out:-<silent>}"
          echo
          echo "--- what the idle timer even is here ---"
          loginctl show-seat seat0 2>&1 | head -5
          echo
          echo "--- systemd-inhibit --list, with one of ours held, verbatim ---"
          # Captured rather than remembered: the audit in --doctor has to parse this,
          # and a parser written from memory is a parser written blind.
          systemd-inhibit --what=idle --mode=block --who=tui-saver --why='probe capture' \
            sh -c 'systemd-inhibit --list' 2>&1 | cat -A | head -20
          exit 0

  probe-windows:
    # The Windows half of the same question: powercfg /requests is what the audit
    # parses, and a GitHub runner is elevated, so this is the one place its real
    # output can be seen.
    if: github.event_name == 'workflow_dispatch'
    name: probe (windows powercfg output)
    runs-on: windows-latest
    steps:
      - name: what powercfg actually prints
        shell: pwsh
        run: |
          Write-Output '--- powercfg /requests, nothing held ---'
          powercfg /requests
          Write-Output '--- powercfg /requests, with a display request held ---'
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Hold {
            [DllImport("kernel32.dll", SetLastError = true)]
            public static extern uint SetThreadExecutionState(uint esFlags);
          }
          '@
          [void][Hold]::SetThreadExecutionState([uint32]2147483651)
          powercfg /requests
          [void][Hold]::SetThreadExecutionState([uint32]2147483648)
          exit 0
